apply plugin: 'com.android.application'

def qaApplicationIdSuffix = project.findProperty('qaApplicationIdSuffix')
def signingPropertiesFile = {
    def configuredPath = System.getenv('ZHIHUPAPER_KEYSTORE_PROPERTIES')
    if (configuredPath) {
        return file(configuredPath)
    }
    def localFile = rootProject.file('keystore.properties')
    if (localFile.exists()) {
        return localFile
    }
    return new File(System.getProperty('user.home'),
            '.config/zhihupaper/signing/keystore.properties')
}()

def forbiddenAssetPatterns = [
        ~/.*\.zip$/,
        ~/.*\.keystore$/,
        ~/.*\.jks$/,
        ~/.*(^|\/)keystore\.properties$/,
        ~/.*(^|\/)local\.properties$/
]

tasks.register('verifyNoSensitiveAssets') {
    group = 'verification'
    description = 'Fails when archives or signing/configuration files could be packaged as assets.'
    doLast {
        def assetsDir = file('src/main/assets')
        def forbiddenFiles = assetsDir.exists() ? fileTree(assetsDir).files.findAll { asset ->
            def relativePath = assetsDir.toPath().relativize(asset.toPath()).toString()
            forbiddenAssetPatterns.any { pattern -> relativePath ==~ pattern }
        } : []
        if (!forbiddenFiles.isEmpty()) {
            throw new GradleException('Forbidden files under app assets: '
                    + forbiddenFiles.collect { it.name }.sort().join(', '))
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyNoSensitiveAssets')
}

if (qaApplicationIdSuffix) {
    // Keep QA's changed manifest/package graph out of canonical Release
    // intermediates. AGP 7.2's incremental resource merger otherwise retains
    // stale Material resource source-set mappings when the suffix is removed.
    buildDir = rootProject.file('build/isolated-qa-app')
}

android {
    namespace 'com.cundong.izhihu'
    compileSdk 36

    defaultConfig {
        applicationId "com.cundong.izhihu"
        // Lets device QA install an isolated copy without uninstalling the user's
        // existing signed build: ./gradlew -PqaApplicationIdSuffix=.loopqa assembleRelease
        if (qaApplicationIdSuffix) {
            applicationIdSuffix qaApplicationIdSuffix
        }
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 24
        versionName "2.3.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The product is Chinese-only; do not ship translated library strings
        // that are never shown by this app.
        resourceConfigurations += ["zh"]
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                def props = new Properties()
                signingPropertiesFile.withInputStream { props.load(it) }
                def configuredStoreFile = new File(props['storeFile'])
                storeFile configuredStoreFile.isAbsolute()
                        ? configuredStoreFile
                        : new File(signingPropertiesFile.parentFile, props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            // Let R8 optimize bytecode and remove resources unreachable from the
            // release graph. This leaves debug iteration untouched.
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding false
        buildConfig true
    }

    lint {
        // The toolchain is intentionally pinned and validated as a unit. An
        // available AGP update is not a source-quality defect for this app.
        disable 'AndroidGradlePluginVersion'
    }
}

dependencies {
    implementation project(':photoview')
    // AndroidX + Material 3. ActionBarSherlock is gone: AppCompat's Toolbar and
    // MaterialToolbar cover everything the app used it for (action bar, action
    // mode, ShareActionProvider, menu inflation).
    //
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.work:work-runtime:2.10.0'
    // Glide replaces universal-image-loader (unmaintained since 2015; its author
    // archived the project). Glide handles bitmap pooling, RecyclerView/ListView
    // recycling, and lifecycle-aware cancellation, none of which UIL did well.
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // Route Glide's network layer through the same OkHttp client stack the rest
    // of the app uses, instead of running a second HttpURLConnection pool.
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    // Required so Glide's annotation processor emits GeneratedAppGlideModuleImpl,
    // which is what actually wires in the okhttp3-integration LibraryGlideModule.
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
