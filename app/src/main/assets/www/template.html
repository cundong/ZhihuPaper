<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=2,user-scalable=yes">
    <meta name="theme-color" content="#1677ff">
    <link href="news_qa.auto.css" rel="stylesheet">
    <link href="news_header.css" rel="stylesheet">
    <script src="img_replace.js"></script>
    <script src="night.js"></script>
    <script>
        function scrollToReaderSection(id) {
            var section = document.getElementById(id);
            if (!section) return;
            var top = section.getBoundingClientRect().top + window.pageYOffset - 72;
            window.scrollTo(0, Math.max(0, top));
        }
    </script>
</head>
<body class="article-body" onload="set_night_mode({nightTheme});">{content}</body>
</html>
