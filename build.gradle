buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Use the same Gradle runtime locally and in CI; Android sources remain Java 8.
def requiredJava = rootProject.file('.java-version').text.trim()
if (JavaVersion.current().majorVersion != requiredJava) {
    throw new GradleException("Use JDK ${requiredJava} for this project (set JAVA_HOME / Android Studio Gradle JDK).")
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        if (project.hasProperty('showJavaDeprecations')) {
            options.compilerArgs += ['-Xlint:deprecation']
        }
    }
}
